name: Refresh the desk

# Twice a week, Monday and Thursday at 06:00 UTC, before the London morning.
# Signals are free to re-read; roles cost per pull, which is why this is not
# daily. See src/config/desk.mjs, REFRESH. Run by hand from the Actions tab
# with workflow_dispatch.
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run refresh
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          PREDICTLEADS_API_KEY: ${{ secrets.PREDICTLEADS_API_KEY }}
          PREDICTLEADS_API_TOKEN: ${{ secrets.PREDICTLEADS_API_TOKEN }}
